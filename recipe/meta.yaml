{% set name = "archapp" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/pcdshub/archapp/archive/v{{ version }}.tar.gz
  sha256: 7a0c66c66919221023c312067b7963b652c641d9e601092cdacc319f0096adac

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - matplotlib-base
    - numpy
    - pandas
    - xarray >=0.19.0

test:
  imports:
    - archapp
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pcdshub/archapp
  summary: Archiver Appliance Python Interface
  license: BSD-3-Clause
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - conda-forge/pcdsdevices
